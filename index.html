<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi PT. A3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2a5298;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(30,60,114,0.3);
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f0f4ff;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result h3 {
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .result p {
      color: #333;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 ABSENSI KARYAWAN</h1>
    <p class="subtitle">PT. A3 - Sistem Absensi Digital</p>

    <form id="absenForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
      </div>

      <div class="form-group">
        <label for="jabatan">Jabatan</label>
        <select id="jabatan" required>
          <option value="">-- Pilih Jabatan --</option>
          <option value="Kepala Toko">Kepala Toko</option>
          <option value="Karyawan">Karyawan</option>
          <option value="Kasir">Kasir</option>
          <option value="Gudang">Gudang</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status Kehadiran</label>
        <select id="status" required>
          <option value="">-- Pilih Status --</option>
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
          <option value="Alpha">Alpha</option>
        </select>
      </div>

      <button type="submit">✅ Kirim Absensi</button>
    </form>

    <div class="result" id="result">
      <h3>✅ Absensi Berhasil!</h3>
      <p><strong>Nama:</strong> <span id="rNama"></span></p>
      <p><strong>Jabatan:</strong> <span id="rJabatan"></span></p>
      <p><strong>Status:</strong> <span id="rStatus"></span></p>
      <p><strong>Waktu:</strong> <span id="rWaktu"></span></p>
    </div>

    <div class="footer">
      © 2026 PT. A3 - All Rights Reserved
    </div>
  </div>

  <script>
    document.getElementById('absenForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nama = document.getElementById('nama').value;
      const jabatan = document.getElementById('jabatan').value;
      const status = document.getElementById('status').value;
      const waktu = new Date().toLocaleString('id-ID');

      document.getElementById('rNama').textContent = nama;
      document.getElementById('rJabatan').textContent = jabatan;
      document.getElementById('rStatus').textContent = status;
      document.getElementById('rWaktu').textContent = waktu;

      const result = document.getElementById('result');
      result.classList.add('show', 'success');

      // Reset form setelah 3 detik
      setTimeout(() => {
        this.reset();
      }, 3000);
    });
  </script>
</body>
</html>
